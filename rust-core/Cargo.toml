[package]
name = "autocomplete-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ranked top-k word completion with adaptive learning and typo search"

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
